name: plan-gate

# This repo's one required CI check. Server-side backstop for the single
# review rule that still blocks a merge: no PR whose commits cite a plan
# with an unresolved CRITICAL/HIGH security finding reaches master purely
# by skipping local hooks (which are all bypassable by design). Everything
# else plan-gate prints is advisory -- see ADR-0002 and
# docs/plans/*/2026-09-09-dismantle-the-blocking-gate-tier-and-keep-the-plan-corpus.md.
# Runs docs/skills/workflow/scripts/plan-gate rather than reimplementing
# it, so a hand-run over the same range gives the same verdict.

on:
  pull_request:
    branches: [master]

jobs:
  plan-gate:
    name: plan-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A pull_request checkout is the PR's own tree, which can include
      # edits to plan-gate/lib.sh themselves -- run the base branch's
      # copy instead, so a PR can't pass this check by neutering the
      # script that's supposed to gate it. This still reads the PR's own
      # *data* (its commits' Plan: trailers, the plan files' content) --
      # only the enforcement logic itself is pinned. Degrades cleanly
      # (nothing to gate) if the base branch doesn't have the script yet
      # -- true only for the one PR that introduces plan-gate itself;
      # every PR after that one has a real base-branch copy to pin to.
      # what pinning does and does not buy:
      # plan: 2026-09-05-route-every-fact-into-one-channel-by-decidability-and-audience.md#F25
      - name: Pin the gate script to the base branch
        id: pin
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p /tmp/plan-gate-trusted/skills/workflow/scripts /tmp/plan-gate-trusted/skills/plan/scripts
          if ! git cat-file -e "origin/$BASE_REF:docs/skills/workflow/scripts/plan-gate" 2>/dev/null; then
            echo "plan-gate does not exist yet on origin/$BASE_REF -- nothing to gate (this must be the PR introducing it)."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show "origin/$BASE_REF:docs/skills/workflow/scripts/plan-gate" > /tmp/plan-gate-trusted/skills/workflow/scripts/plan-gate
          git show "origin/$BASE_REF:docs/skills/plan/scripts/lib.sh" > /tmp/plan-gate-trusted/skills/plan/scripts/lib.sh
          chmod +x /tmp/plan-gate-trusted/skills/workflow/scripts/plan-gate
          # required-agents is pinned only for the transition window: the
          # base branch's plan-gate may still be the stamp-checking one,
          # which requires it beside itself and blocks without it. Once a
          # base-branch plan-gate no longer calls it, this copy is inert
          # and the block can be dropped.
          if git cat-file -e "origin/$BASE_REF:docs/skills/workflow/scripts/required-agents" 2>/dev/null; then
            git show "origin/$BASE_REF:docs/skills/workflow/scripts/required-agents" > /tmp/plan-gate-trusted/skills/workflow/scripts/required-agents
            chmod +x /tmp/plan-gate-trusted/skills/workflow/scripts/required-agents
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Check cited plans for unresolved critical security findings
        if: steps.pin.outputs.found == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: /tmp/plan-gate-trusted/skills/workflow/scripts/plan-gate "origin/$BASE_REF" "$HEAD_SHA"

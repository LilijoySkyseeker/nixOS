# Per-host parameters for scripts/reinstall-host.sh. Copy this file to
# <hostname>.conf to add a new host — everything here should be
# derivable from hosts/<host>/disko.nix and hosts/<host>/configuration.nix.

# Flake attribute name (hosts/<HOST>/).
HOST=thinkpad

# disko-install --disk NAME PATH pairs, one per physical disk. Must
# match the disk attrset keys in hosts/<HOST>/disko.nix exactly (disko
# fails loudly if a name doesn't match).
DISKO_DISKS=(
  "nvme-a=/dev/disk/by-id/nvme-Samsung_SSD_970_EVO_Plus_500GB_S58SNS0R706072M"
)

# SSH target for homelab (Tailscale MagicDNS name — resolvable from
# the recovery ISO once it's on the tailnet, over the operator's
# forwarded agent — see hosts/isoimage's AllowAgentForwarding).
HOMELAB_SSH=root@homelab

# Where the temporary pre-reinstall data backup lands on homelab.
# TEMPORARY: this whole backup/restore flow (this script's `backup`
# and `restore` stages) is a stand-in for real automated backups.
# Once the automated backup system (being built in another
# session/branch) covers thinkpad, delete these two stages and restore
# from there instead — see TODO.md.
BACKUP_DATASET=zbackup/backup-bulk/thinkpad

# Name of this host's CURRENT (pre-reinstall) zpool — the `backup`
# stage imports this by name from the recovery ISO (booted straight to
# the ISO, disk not yet wiped) to read the data out before disko-install
# destroys it. Same literal pool name as the post-reinstall layout in
# hosts/thinkpad/disko.nix; this repo's LUKS wrapping doesn't rename it.
SOURCE_POOL=zroot

# Datasets on SOURCE_POOL to snapshot and syncoid-send to
# BACKUP_DATASET before wiping the disk. Root/nix are disposable under
# the new impermanence model, so only home data is backed up — anything
# under environment.persistence survives the reinstall by design once
# Phase 2 lands, and everything else in root is meant to be
# blank-snapshotted away anyway.
DATA_DATASETS=(
  "zroot/local/home"
)

# Dataset restored data lands under on the newly disko-installed pool
# (still imported on the ISO, before first boot into the new install).
RESTORE_DATASET=zroot/local/home
